[project]
name = "steam-reviews"
version = "0.1.0"
description = "Steam reviews analytics: NiFi -> HDFS -> Spark -> dashboard"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["spark: needs a local SparkSession (Java 17, HADOOP_HOME on Windows)"]
