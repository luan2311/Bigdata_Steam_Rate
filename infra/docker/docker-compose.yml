services:
  # ============================================================================
  # HADOOP HDFS CLUSTER (1 NameNode + 2 DataNodes)
  # ============================================================================
  hdfs-namenode:
    image: apache/hadoop:3.3.6
    container_name: hdfs-namenode
    hostname: hdfs-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"   # NameNode Web UI & WebHDFS REST
      - "9000:9000"   # HDFS RPC Client Port
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_replication=2
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ../hadoop/start-namenode.sh:/opt/hadoop/start-namenode.sh:ro
      - hadoop-namenode-data:/hadoop/dfs/name
    entrypoint: ["/bin/bash", "/opt/hadoop/start-namenode.sh"]
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  hdfs-datanode-1:
    image: apache/hadoop:3.3.6
    container_name: hdfs-datanode-1
    hostname: hdfs-datanode-1
    restart: unless-stopped
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    ports:
      - "9864:9864"   # DataNode 1 Web UI
      - "9866:9866"   # DataNode 1 Data Transfer
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ../hadoop/start-datanode.sh:/opt/hadoop/start-datanode.sh:ro
      - hadoop-datanode1-data:/hadoop/dfs/data
    entrypoint: ["/bin/bash", "/opt/hadoop/start-datanode.sh"]
    networks:
      - bigdata-net

  hdfs-datanode-2:
    image: apache/hadoop:3.3.6
    container_name: hdfs-datanode-2
    hostname: hdfs-datanode-2
    restart: unless-stopped
    depends_on:
      hdfs-namenode:
        condition: service_healthy
    ports:
      - "9865:9864"   # DataNode 2 Web UI (Host port 9865)
      - "9867:9866"   # DataNode 2 Data Transfer (Host port 9867)
    environment:
      - HADOOP_HOME=/opt/hadoop
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - ../hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ../hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ../hadoop/start-datanode.sh:/opt/hadoop/start-datanode.sh:ro
      - hadoop-datanode2-data:/hadoop/dfs/data
    entrypoint: ["/bin/bash", "/opt/hadoop/start-datanode.sh"]
    networks:
      - bigdata-net

  # ============================================================================
  # APACHE SPARK CLUSTER (1 Master + 2 Workers)
  # ============================================================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    restart: unless-stopped
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC Port
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--ip", "0.0.0.0", "--port", "7077", "--webui-port", "8080"]
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    hostname: spark-worker-1
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"   # Spark Worker 1 Web UI
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--webui-port", "8081", "spark://spark-master:7077"]
    networks:
      - bigdata-net

  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    hostname: spark-worker-2
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8081"   # Spark Worker 2 Web UI (Host port 8082)
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--webui-port", "8081", "spark://spark-master:7077"]
    networks:
      - bigdata-net

  # ============================================================================
  # APACHE NIFI (Ingestion Gateway)
  # ============================================================================
  nifi:
    image: apache/nifi:2.0.0
    container_name: nifi
    hostname: nifi
    restart: unless-stopped
    ports:
      - "8443:8443"   # NiFi Web UI HTTPS (Không dùng 8080 vì trùng Spark Master)
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=BigDataSteam2026!
      - NIFI_JVM_HEAP_INIT=1g
      - NIFI_JVM_HEAP_MAX=2g
    volumes:
      - ../../data/landing:/opt/nifi/data/landing:ro
      - ../../data/sample:/opt/nifi/data/sample:ro
      - ../../nifi/flows:/opt/nifi/flows
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-database-repo:/opt/nifi/nifi-current/database_repository
      - nifi-flowfile-repo:/opt/nifi/nifi-current/flowfile_repository
      - nifi-content-repo:/opt/nifi/nifi-current/content_repository
      - nifi-provenance-repo:/opt/nifi/nifi-current/provenance_repository
    networks:
      - bigdata-net

networks:
  bigdata-net:
    name: bigdata-cluster-net
    driver: bridge

volumes:
  hadoop-namenode-data:
    name: hadoop_namenode_data
  hadoop-datanode1-data:
    name: hadoop_datanode1_data
  hadoop-datanode2-data:
    name: hadoop_datanode2_data
  nifi-conf:
    name: nifi_conf_data
  nifi-database-repo:
    name: nifi_database_repo_data
  nifi-flowfile-repo:
    name: nifi_flowfile_repo_data
  nifi-content-repo:
    name: nifi_content_repo_data
  nifi-provenance-repo:
    name: nifi_provenance_repo_data
